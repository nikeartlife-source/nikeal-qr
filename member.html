<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規会員登録 - NikeAL</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>NikeAL</h1>
    <p>新規会員登録</p>

    <div id="memberForm">

      <label>
        氏名
        <input type="text" id="name" placeholder="例：山田 花子">
      </label>

      <label>
        フリガナ
        <input type="text" id="kana" placeholder="例：ヤマダ ハナコ">
      </label>

      <label>
        入会日
        <input type="date" id="joinDate">

      </label>

      <label>
        会員種別

        <select id="memberType">

          <option value="一般">一般</option>
          <option value="ジュニア">ジュニア</option>

        </select>
      </label>

      <label>
        生年月日
        <input type="date" id="birthday">
      </label>

      <label>
        保護者名
        <input type="text" id="guardianName" placeholder="ジュニアの場合">
      </label>

      <label>
        メモ
        <textarea id="memo" rows="3"></textarea>
      </label>

      <button id="registerButton">
        会員登録する
      </button>

      <button onclick="location.href='index.html'">
        戻る
      </button>

    </div>
    <div id="result"></div>
  </div>

  <script src="member.js?v=1"></script>

</body>
</html>
