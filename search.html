<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会員検索 - NikeAL</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>NikeAL</h1>
    <p>会員検索</p>
    <div id="searchForm">

      <label>
        氏名・フリガナ
        <input
          type="text"
          id="keyword"
          placeholder="例：山田花子"
        >
      </label>

      <button id="searchButton">
        🔍 検索する
      </button>

      <button onclick="location.href='index.html'">
        戻る
      </button>
    </div>

    <div id="result"></div>
  </div>
  
  <script src="search.js?v=1"></script>

</body>
</html>
